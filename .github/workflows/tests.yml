name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax
        run: |
          for f in runtime-input.js match-hub.js team-management.js settings.js spectator.js statistics/adapter.js coach.js sw.js js/*.js; do
            node --check "$f"
          done

      - name: Install lint tooling
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright numpy pillow python-docx jsonschema
          python -m playwright install --with-deps chromium

      - name: Approved test gate
        run: bash tests/run_v1_28_approved.sh

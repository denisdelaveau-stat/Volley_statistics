name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: JavaScript syntax
        run: |
          for f in runtime-input.js match-hub.js team-management.js settings.js spectator.js statistics/adapter.js coach.js sw.js js/*.js; do
            node --check "$f"
          done

      - name: Install lint tooling
        run: npm ci

      - name: ESLint (no warnings allowed)
        run: npm run lint

      - name: Prettier (JavaScript)
        run: npx prettier --check .

      - name: Unit tests (node:test)
        run: npm run test:unit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright numpy pillow python-docx jsonschema
          python -m playwright install --with-deps chromium

      # Each failing test is also published as an annotation, readable on the run page and through the public
      # check-runs API (job logs need authentication).
      - name: Approved test gate
        run: |
          set +e
          bash tests/run_v1_28_approved.sh -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          python tools/ci_annotate_failures.py pytest.log
          exit $status

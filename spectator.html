<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03182f">
  <title>VolleyLive · Spectateur</title>
  <link rel="stylesheet" href="spectator.css">
</head>
<body>
<div class="spectator-app" id="spectatorApp">
  <header class="spectator-header">
    <a class="spectator-brand" href="index.html" aria-label="Retour à la page principale"><span class="brand-mark">◉</span><strong>VolleyLive</strong></a>
    <span class="archive-badge" id="archiveBadge">ARCHIVE</span>
    <div class="scoreboard" aria-live="polite">
      <span class="score-side-label">AWAY</span><strong id="headerAway">0</strong><span class="score-separator">:</span><strong id="headerHome">0</strong><span class="score-side-label">HOME</span>
      <small id="headerSet">SET 1 · 0–0</small>
    </div>
    <a class="spectator-home" href="index.html"><span aria-hidden="true">⌂</span> ACCUEIL</a>
  </header>

  <nav class="spectator-nav" aria-label="Navigation spectateur">
    <button type="button" data-tab="live-score">LIVE SCORE</button>
    <button type="button" data-tab="live-timeline" aria-selected="true">LIVE TIMELINE</button>
    <button type="button" data-tab="stats">STATS</button>
  </nav>

  <main>
    <section class="spectator-panel" data-panel="live-score" hidden>
      <div class="summary-card"><p>REPLAY D’ARCHIVE</p><div><strong id="summaryAway">0</strong><span>:</span><strong id="summaryHome">0</strong></div><h1 id="summaryMatch">Match</h1><p id="summarySet">Set 1</p></div>
    </section>

    <section class="spectator-panel timeline-panel" data-panel="live-timeline">
      <div class="timeline-filterbar">
        <fieldset><legend>En haut</legend><div class="segment"><button type="button" data-order="oldestFirst">Plus anciennes</button><button type="button" data-order="newestFirst">Plus récentes</button></div></fieldset>
        <label>Nombre d’actions<select id="windowSize"><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="all">Tout le set</option></select></label>
      </div>
      <div class="timeline-board">
        <div class="timeline-title">
          <strong id="awayName">AWAY</strong>
          <div><h1 id="timelineSet">SET 1 · Fil du match</h1><p>Score : AWAY — HOME</p><p id="timelineOrder">Ancien → récent</p></div>
          <strong id="homeName">HOME</strong>
        </div>
        <div class="timeline-columns" aria-hidden="true"><span>0</span><b>AWAY</b><i></i><b>HOME</b><span>0</span></div>
        <div id="timelineList" class="timeline-list" aria-live="polite"></div>
        <div id="timelineEmpty" class="timeline-empty" hidden>Le set n’a pas encore commencé</div>
        <div id="timelineWarning" class="timeline-warning" hidden></div>
        <footer class="timeline-footer">
          <div class="replay-status"><span></span> REPLAY D’ARCHIVE</div>
        </footer>
      </div>
    </section>

    <section class="spectator-panel" data-panel="stats" hidden>
      <div class="stats-card"><h1>STATS</h1><p id="statsSummary"></p><button type="button" id="openAdvancedStats">OUVRIR ADVANCED STATISTICS</button></div>
    </section>
  </main>
</div>
<div class="fatal" id="fatal" hidden><h1>Archive indisponible</h1><p id="fatalText"></p><a href="index.html">Retour à la page principale</a></div>
<script src="statistics/adapter.js"></script>
<script src="spectator.js"></script>
</body>
</html>
